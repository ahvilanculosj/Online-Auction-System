<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Vendedor - SecureAuction</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🔒 SecureAuction</div>
        <ul class="nav-links">
            <li><a href="seller.html">Meus Produtos</a></li>
            <li><a href="auctions.html">Leilões</a></li>
            <li><a href="#" onclick="logout()">Sair</a></li>
        </ul>
    </nav>

    <div class="dashboard">
        <h1>Painel do Vendedor</h1>
        <div id="alert" class="alert"></div>

        <div class="form-container" style="margin:0 0 2rem 0;max-width:100%;">
            <h2>Adicionar Produto</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Descrição</label>
                    <input type="text" id="description" required>
                </div>
                <div class="form-group">
                    <label for="startPrice">Preço Inicial (AOA)</label>
                    <input type="number" id="startPrice" min="1" required>
                </div>
                <div class="form-group">
                    <label for="duration">Duração (horas)</label>
                    <input type="number" id="duration" min="1" value="24" required>
                </div>
                <button type="submit" class="btn btn-primary">Adicionar Produto</button>
            </form>
        </div>

        <h2 style="margin-bottom:1rem;color:#1a2332;">Meus Produtos</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Título</th><th>Preço Atual</th><th>Estado</th><th>Ações</th></tr>
                </thead>
                <tbody id="productTable"></tbody>
            </table>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/auctions.js"></script>
    <script src="js/seller.js"></script>
</body>
</html>
