<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SecureAuction</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🔒 SecureAuction</div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="auctions.html">Leilões</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Registar</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Entrar</h2>
        <div id="alert" class="alert"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <p style="text-align:center;margin-top:1rem;">
            Não tem conta? <a href="register.html">Registar</a>
        </p>
        <p style="text-align:center;font-size:0.85rem;color:#888;margin-top:0.5rem;">
            Admin demo: admin@auction.com / admin123
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
